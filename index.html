<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="This domain is for sale. Please contact info@enchart.me">
  <title>This domain is for sale</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f6f8;
      color: #182333;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: 100%;
      max-width: 640px;
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid #e1e6ec;
      border-radius: 20px;
      background: #fff;
      text-align: center;
      box-shadow: 0 12px 40px rgb(24 35 51 / 6%);
    }
    h1 {
      margin: 0 0 20px;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.15;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }
    p { margin: 0; font-size: 1.125rem; line-height: 1.7; }
    a { color: #2458b8; text-underline-offset: 4px; overflow-wrap: anywhere; }
    a:hover { color: #163b7d; }
    a:focus-visible { outline: 3px solid #2458b8; outline-offset: 5px; border-radius: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>This domain is for sale.</h1>
    <p>The calendar app has moved to <a href="https://fixthetime.com">https://fixthetime.com</a></p>
    <p>To acquire this domain please offer your bid to <a href="mailto:info@enchart.me">info@enchart.me</a></p>
  </main>
</body>
</html>
